name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      VP_GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          cache: true
      - name: Check
        run: vp check
      - name: Run Tests
        run: vp test run --coverage
      - name: Build
        run: vp build
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: build
    env:
      VP_GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          cache: true
      - name: Run Tests
        run: vp test run --coverage
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
